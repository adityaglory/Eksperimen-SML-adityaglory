name: Automated Data Preprocessing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn

    - name: Run preprocessing automation
      run: |
        cd preprocessing
        python automate_Glory-Aditya.py

    - name: Upload processed dataset
      uses: actions/upload-artifact@v4
      with:
        name: clean-dataset
        path: preprocessing/bank_churn_preprocessing/